<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">International Space Station top-view silhouette</title>
  <desc id="desc">Simplified top-view vector silhouette of the International Space Station for map marker use.</desc>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g fill="#eef8ff" stroke="#82dfff" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)">
    <rect x="85" y="238" width="160" height="96" rx="12"/>
    <rect x="85" y="566" width="160" height="96" rx="12"/>
    <rect x="255" y="238" width="160" height="96" rx="12"/>
    <rect x="255" y="566" width="160" height="96" rx="12"/>
    <rect x="785" y="238" width="160" height="96" rx="12"/>
    <rect x="785" y="566" width="160" height="96" rx="12"/>
    <rect x="955" y="238" width="160" height="96" rx="12"/>
    <rect x="955" y="566" width="160" height="96" rx="12"/>
    <line x1="165" y1="334" x2="165" y2="566"/>
    <line x1="335" y1="334" x2="335" y2="566"/>
    <line x1="865" y1="334" x2="865" y2="566"/>
    <line x1="1035" y1="334" x2="1035" y2="566"/>
    <line x1="415" y1="450" x2="785" y2="450"/>
    <line x1="600" y1="300" x2="600" y2="600"/>
    <rect x="520" y="390" width="160" height="120" rx="26"/>
    <circle cx="600" cy="450" r="58"/>
    <rect x="458" y="420" width="88" height="60" rx="14"/>
    <rect x="654" y="420" width="88" height="60" rx="14"/>
    <rect x="576" y="264" width="48" height="126" rx="16"/>
    <rect x="576" y="510" width="48" height="126" rx="16"/>
    <line x1="520" y1="450" x2="415" y2="450"/>
    <line x1="680" y1="450" x2="785" y2="450"/>
    <line x1="600" y1="264" x2="600" y2="165"/>
    <line x1="600" y1="636" x2="600" y2="735"/>
    <rect x="548" y="112" width="104" height="52" rx="8"/>
