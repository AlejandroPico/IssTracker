<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Icono ISS estilizado</title>
  <desc id="desc">Icono vectorial original de una estación espacial sobre una órbita.</desc>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#8be9ff"/>
      <stop offset="1" stop-color="#126d9f"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="56" fill="rgba(0, 170, 255, 0.08)" stroke="#34c6ff" stroke-width="2"/>
  <path d="M18 76c20-22 55-32 92-25" fill="none" stroke="#7fe9ff" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <g filter="url(#glow)" transform="rotate(-14 64 64)">
    <rect x="53" y="50" width="22" height="28" rx="5" fill="#f7fbff" stroke="#0e506e" stroke-width="3"/>
    <rect x="22" y="52" width="26" height="24" rx="3" fill="url(#panel)" stroke="#d9fbff" stroke-width="2"/>
    <rect x="80" y="52" width="26" height="24" rx="3" fill="url(#panel)" stroke="#d9fbff" stroke-width="2"/>
    <path d="M48 64h-8M80 64h8" stroke="#f7fbff" stroke-width="5" stroke-linecap="round"/>
    <rect x="60" y="32" width="8" height="18" rx="3" fill="#f7fbff"/>
    <rect x="60" y="78" width="8" height="18" rx="3" fill="#f7fbff"/>
    <circle cx="64" cy="64" r="5" fill="#00aaff"/>
  </g>
</svg>
